<!-- This will get turned into one big lua function where values passed to it are represented by a @<name> -->
<!DOCTYPE html>
<html lang="en" />

<head>
  <title>Examples</title>
</head>

<body>
  <h1>
    <%= "Lua string" %>
  </h1>
  <h2>
    <%= @hello %>
  </h2>
  <%= 1 + 2 %>
    <ol>
      <% for i=1, #@array, 1 do %>
        <li>
          <%= @array[i] %>
        </li>
        <% end %>
    </ol>
</body>
